<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart</title>

  <style>
    :root {
      --blue: #0a49cf;
      --light-blue: #eef4ff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #fff;
      padding: 20px;
      color: #111;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--blue);
      font-weight: 700;
    }

    .cart {
      max-width: 1100px;
      margin: auto;
    }

    .cart-header,
    .cart-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 0.5fr;
      gap: 16px;
      align-items: center;
    }

    .cart-header {
      padding: 12px 0;
      border-bottom: 2px solid var(--border);
      font-weight: bold;
      color: var(--blue);
    }

    .cart-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .product {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .product-info h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .product-info p {
      font-size: 13px;
      color: #555;
    }

    .price,
    .total {
      font-weight: bold;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: var(--light-blue);
      color: var(--blue);
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
    }

    .qty span {
      min-width: 24px;
      text-align: center;
      font-weight: bold;
    }

    .summary {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .summary-box {
      width: 280px;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
      background: var(--light-blue);
    }

    .summary-box div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
    }
.delete-btn {
  background: transparent;
  border: none;
  color: red;
  font-size: 18px;
  cursor: pointer;
}

    .checkout {
      width: 100%;
      padding: 10px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .cart-header {
        display: none;
      }

      .cart-item {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .price::before {
        content: "Price: ";
        color: #555;
      }

      .total::before {
        content: "Total: ";
        color: #555;
      }
      .delete-btn {
  align-self: flex-start;
}

    }
  </style>
</head>
<body>

<h1>Your Cart</h1>

<div class="cart">
  <div class="cart-header">
    <div>Product</div>
    <div>Price</div>
    <div>Quantity</div>
    <div>Total</div>
      <div>Remove</div>
  </div>

  <!-- CART ITEMS -->
  <div id="cartItems"></div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="summary-box">
      <div>
        <span>Sub Total</span>
        <span id="subTotal">$0.00</span>
      </div>
      <button class="checkout">Go to Checkout</button>
    </div>
  </div>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartItemsDiv = document.getElementById("cartItems");
  const subTotalEl = document.getElementById("subTotal");

  function renderCart() {
    cartItemsDiv.innerHTML = "";
    let subTotal = 0;

    if (cart.length === 0) {
      cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
      subTotalEl.textContent = "$0.00";
      return;
    }

    cart.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      subTotal += itemTotal;

      const div = document.createElement("div");
      div.classList.add("cart-item");

      div.innerHTML = `
        <div class="product">
          <img src="${item.img}" alt="${item.name}">
          <div class="product-info">
            <h4>${item.name}</h4>
            <p>Size: ${item.size}</p>
          </div>
        </div>

        <div class="price">$${item.price.toFixed(2)}</div>

        <div class="qty">
          <button onclick="changeQty(${index}, -1)">-</button>
          <span>${item.quantity}</span>
          <button onclick="changeQty(${index}, 1)">+</button>
        </div>

        <div class="total">$${itemTotal.toFixed(2)}</div>

<button class="delete-btn" onclick="removeItem(${index})">✖</button>

      `;

      cartItemsDiv.appendChild(div);
    });

    subTotalEl.textContent = `$${subTotal.toFixed(2)}`;
  }

  function changeQty(index, change) {
    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {
      cart.splice(index, 1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  renderCart();

  function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

</script>

</body>
</html>
